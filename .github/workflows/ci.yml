name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile publish.py

      - name: Import & CLI smoke test (--help)
        run: python publish.py --help

      - name: Lint with ruff (non-blocking)
        run: |
          pip install ruff
          ruff check publish.py || true
